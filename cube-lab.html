<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cube Lab</title><style>*{box-sizing:border-box}body{margin:0;background:#e9edef;color:#18262f;font:14px Georgia,"Microsoft YaHei",serif}.lab{width:min(100%,520px);margin:auto;padding:16px}.bar{display:grid;grid-template-columns:1fr;gap:8px;margin-bottom:12px}.row{display:grid;grid-template-columns:90px 1fr auto;gap:8px;align-items:center}select,input,button{height:38px;border:1px solid #58666f;border-radius:0;background:#fff;color:inherit;font:inherit}button{padding:0 12px;background:#203b4a;color:#fff}.cmd{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.view{height:min(78vw,430px);min-height:320px;border:1px solid #87939a;background:#edf0f1}.view canvas{display:block;width:100%;height:100%;touch-action:none}.meta{margin-top:8px;color:#53636d;line-height:1.5}</style><script src="vendor/three/gr3.min.js?v=lab1"></script></head><body><main class="lab"><section class="bar"><div class="row"><label for="mode">描边方案</label><select id="mode"><option value="wide">屏幕宽线</option><option value="tube">几何圆柱棱</option><option value="native">原生细线</option></select><button id="shot">截图</button></div><div class="row"><label for="width">线宽</label><input id="width" type="range" min="1" max="5" step=".25" value="2"><output id="wv">2 px</output></div><div class="row"><label for="skew">斜伸量</label><input id="skew" type="range" min=".15" max=".6" step=".01" value=".38"><output id="sv">0.38</output></div><div class="cmd"><button id="left">左转</button><button id="reset">归正</button><button id="right">右转</button></div></section><div class="view" id="view"></div><div class="meta" id="meta">正面横平竖直 · 深度边平行斜伸 · 拖动旋转 · 滚轮缩放</div></main><script src="cube-lab.js?v=2"></script></body></html>
