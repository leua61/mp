<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>成语战境界面测试</title><style>
:root{--ink:#073f52;--muted:rgba(7,63,82,.76);--miku:57,197,187;--rin:255,165,0;--len:255,226,17;--luka:232,154,170;--kaito:49,85,198;--display-font:KaiTi,"Microsoft YaHei",serif;font-family:Arial,"Microsoft YaHei",sans-serif;color:var(--ink);background:#dff6f8}*{box-sizing:border-box}body{margin:0;padding:12px}.lab{display:grid;gap:10px;max-width:720px;margin:auto}.barx{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px;border-radius:12px;background:#fff}.barx button{padding:7px 10px;border:1px solid #b9d7dc;border-radius:9px;background:#f8ffff;font-weight:800}.barx b{margin-right:auto}.host{width:min(100%,var(--w));height:var(--h);margin:auto;border:1px dashed #74aab4;border-radius:16px;padding:2px;background:rgba(255,255,255,.45)}.host .iwb{width:100%;height:100%}.res{padding:8px 10px;border-radius:10px;background:#fff;font:12px/1.45 ui-monospace,Consolas,monospace;white-space:pre-wrap}.okx{color:#087f77}.badx{color:#b52d47}
</style><script>window.Game={iw:{}};</script><script src="lessons/idiom_world/_m_battle_view.js"></script></head><body><main class="lab"><div class="barx"><b>成语战境 · 尺寸压力测试</b><button data-s="360,420">360×420</button><button data-s="390,520">390×520</button><button data-s="390,640">390×640 推荐</button><button data-s="430,680">430×680</button><button data-s="560,620">560×620</button></div><div class="host" style="--w:390px;--h:520px"><section class="iwb" id="b"></section></div><div class="res" id="r"></div></main><script>
document.head.insertAdjacentHTML('beforeend',Game.iw.battleCss);
const glyph=z=>`<button class="iwb-glyph" style="--dom:42,139,190"><b>${z}</b><small>名域</small></button>`;
const side=(n,e='')=>`<section class="iwb-side iwb-card ${e}"><div class="iwb-name"><b>${n}</b><em class="rank-L" style="--rank:57,197,187">L</em></div><div class="iwb-hp"><span>HP</span><div class="iwb-bar" style="--hp:78%"><i></i></div><b>7/9</b></div><div class="iwb-glyphs">${['高','山','仰','止'].map(glyph).join('')}</div><div class="iwb-groups"><button class="iwb-group"><b>高山</b><small>可用 ×2</small></button><button class="iwb-group"><b>仰止</b><small>可用 ×2</small></button></div></section>`;
const opt=(x,y,t)=>`<button class="iwb-flyopt" style="--tone:var(--miku);--x:${x}%;--y:${y}%;--sx:0%;--sy:0%;--mx:0%;--my:0%;--ex:0%;--ey:0%;animation:none;transform:translate(-50%,-50%)"><b>${t}</b><small>当前含义测试文本</small></button>`;
const html=()=>`<div class="iwb-screen"><header class="iwb-top"><div class="iwb-title"><b>第 3 回合</b><small>我方行动｜小屏完整显示测试</small></div><span class="iwb-badge">初音未来教研组</span></header><div class="iwb-main"><section class="iwb-scene"><div class="iwb-arena">${side('高山仰止','enemy')}<div class="iwb-vs"><span>我方出招</span><b>VS</b><span>名域守势</span></div>${side('曲突徙薪','player')}</div></section><section class="iwb-prompt iwb-card"><p>“曲”在“曲突徙薪”中的战斗解释是：</p><small>战斗中直接选择“词性｜当前含义”。答对才能吃到加成。</small><div class="iwb-timer"><div class="iwb-track" style="--t:64%"><i></i><b></b></div><span class="iwb-time">3.2s</span></div><div class="iwb-fly">${opt(25,31,'名词')}${opt(75,31,'动词')}${opt(25,69,'形容词')}${opt(75,69,'副词')}</div></section><div class="iwb-log">完整性测试：敌我信息、题面、四个飞入选项、日志与退出按钮都不能被无提示裁掉。</div></div><div class="iwb-actions"><button class="iwb-action danger">退出本场</button></div></div>`;
const b=document.querySelector('#b'),h=document.querySelector('.host'),r=document.querySelector('#r');
const test=()=>{b.innerHTML=html();requestAnimationFrame(()=>{const m=b.querySelector('.iwb-main'),f=b.querySelector('.iwb-actions'),top=b.querySelector('.iwb-top'),fly=b.querySelector('.iwb-fly'),sc=b.querySelector('.iwb-scene'),ar=b.querySelector('.iwb-arena'),pr=b.querySelector('.iwb-prompt'),ors=[...b.querySelectorAll('.iwb-flyopt')],br=b.getBoundingClientRect(),fr=f.getBoundingClientRect(),tr=top.getBoundingClientRect(),sr=sc.getBoundingClientRect(),rr=ar.getBoundingClientRect(),ov=b.scrollWidth>b.clientWidth+1,foot=fr.bottom<=br.bottom+1&&fr.top>=br.top-1,head=tr.top>=br.top-1&&tr.bottom<=br.bottom+1,arena=rr.top>=sr.top-1&&rr.bottom<=sr.bottom+1,prompt=pr.scrollHeight<=pr.clientHeight+1,opts=ors.every(x=>{const q=x.getBoundingClientRect(),p=fly.getBoundingClientRect();return q.left>=p.left-1&&q.right<=p.right+1&&q.top>=p.top-1&&q.bottom<=p.bottom+1}),scroll=getComputedStyle(m).overflowY!=='hidden'&&m.scrollHeight>=m.clientHeight;const ok=!ov&&foot&&head&&arena&&prompt&&opts&&scroll;r.className='res '+(ok?'okx':'badx');r.textContent=`${ok?'PASS':'FAIL'}  host=${Math.round(h.clientWidth)}×${Math.round(h.clientHeight)}\n横向溢出=${ov?'有':'无'}  顶栏=${head?'完整':'异常'}  底栏=${foot?'完整':'异常'}\n战场边界=${arena?'完整':'重叠'}  题面边界=${prompt?'完整':'重叠'}  飞入选项=${opts?'完整':'越界'}\n主战区=${m.scrollHeight>m.clientHeight?'安全滚动':'一屏容纳'} (${m.clientHeight}/${m.scrollHeight})`;});};
document.querySelectorAll('[data-s]').forEach(x=>x.onclick=()=>{const [w,v]=x.dataset.s.split(',');h.style.setProperty('--w',w+'px');h.style.setProperty('--h',v+'px');test()});test();
</script></body></html>
